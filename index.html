<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Segredo.me — Mural Anônimo da Galera</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #ec4899;
      --secondary: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-weight: 800;
      font-size: 1.3rem;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 0.78rem;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.3);
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
    }

    .container {
      max-width: 720px;
      margin: 1.5rem auto;
      padding: 0 1rem 4rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .card-title {
      font-size: 1.2rem;
      margin-bottom: 0.3rem;
    }

    .card-sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.1rem;
    }

    .target-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .target-row label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      padding: 0.65rem 0.85rem;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
    }

    select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .textarea-wrapper {
      position: relative;
    }

    textarea {
      width: 100%;
      min-height: 105px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 2.75rem 1rem 1rem;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    #diceBtn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.35rem 0.5rem;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
    }

    #charCount {
      font-size: 0.8rem;
      color: var(--muted);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 0.6rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-primary, .btn-send {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      padding: 0.65rem 1.25rem;
    }

    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.8rem;
      font-size: 0.8rem;
    }

    .feed-section {
      margin-top: 2rem;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .feed-header h2 {
      font-size: 1.15rem;
    }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-bar select {
      padding: 0.4rem 0.7rem;
      font-size: 0.85rem;
    }

    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .msg-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      overflow: hidden;
    }

    .msg-question {
      background: linear-gradient(90deg, rgba(236, 72, 153, 0.16), rgba(139, 92, 246, 0.16));
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .msg-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .tag-to {
      background: rgba(236, 72, 153, 0.25);
      color: #fbcfe8;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-weight: 700;
    }

    .msg-text {
      font-size: 1rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .msg-answer-box {
      padding: 1rem 1.25rem;
    }

    .answer-text {
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .reply-form {
      display: flex;
      gap: 0.5rem;
    }

    .reply-form input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.55rem 0.75rem;
      color: var(--text);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      background: var(--card);
      border-radius: 0.9rem;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">🤫 Segredo.me</div>
    <div style="display:flex; gap:0.5rem; align-items:center;">
      <span class="status-badge">● Ao vivo</span>
      <button id="shareBtn" class="btn-secondary">🔗 Copiar link</button>
    </div>
  </header>

  <main class="container">
    <!-- Caixa única para mandar pergunta anônima -->
    <section class="card">
      <h1 class="card-title">Mande uma pergunta anônima</h1>
      <p class="card-sub">Ninguém vai saber quem enviou. Aparece na hora no mural para todos verem!</p>

      <form id="questionForm">
        <div class="target-row">
          <label for="targetSelect">Para quem?</label>
          <select id="targetSelect">
            <option value="Geral">👥 Todos / Geral</option>
            <option value="Isa">🌸 Isa</option>
            <option value="Kai">⚡ Kai</option>
            <option value="Sara">✨ Sara</option>
            <option value="Jhon">🔥 Jhon</option>
            <option value="Bruna">🦋 Bruna</option>
            <option value="Efrain">🎯 Efrain</option>
            <option value="Rubens">🚀 Rubens</option>
            <option value="Jean">🎧 Jean</option>
            <option value="Renan">😎 Renan</option>
          </select>
        </div>

        <div class="textarea-wrapper">
          <textarea
            id="questionInput"
            maxlength="300"
            placeholder="Escreva sua pergunta ou segredo aqui... 👀"
            required
          ></textarea>
          <button type="button" id="diceBtn" title="Gerar pergunta aleatória">🎲</button>
        </div>

        <div class="form-footer">
          <span id="charCount">0/300</span>
          <button type="submit" id="sendBtn" class="btn-send">Enviar anonimamente 🚀</button>
        </div>
      </form>
    </section>

    <!-- Mural Único com todas as perguntas e respostas -->
    <section class="feed-section">
      <div class="feed-header">
        <h2>Mural Geral (Tempo Real)</h2>
        <div class="filter-bar">
          <select id="filterPerson" aria-label="Filtrar por pessoa">
            <option value="ALL">Mostrar: Todos</option>
            <option value="Geral">Geral</option>
            <option value="Isa">Isa</option>
            <option value="Kai">Kai</option>
            <option value="Sara">Sara</option>
            <option value="Jhon">Jhon</option>
            <option value="Bruna">Bruna</option>
            <option value="Efrain">Efrain</option>
            <option value="Rubens">Rubens</option>
            <option value="Jean">Jean</option>
            <option value="Renan">Renan</option>
          </select>
        </div>
      </div>

      <div id="messagesList" class="messages-list">
        <p class="empty">Conectando ao mural...</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 🔧 COLE AQUI AS CONFIGURAÇÕES DO SEU PROJETO FIREBASE
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO_ID",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const targetSelect = document.getElementById("targetSelect");
    const filterPerson = document.getElementById("filterPerson");
    const questionForm = document.getElementById("questionForm");
    const questionInput = document.getElementById("questionInput");
    const charCount = document.getElementById("charCount");
    const sendBtn = document.getElementById("sendBtn");
    const messagesList = document.getElementById("messagesList");

    let allMessages = [];

    const randomPrompts = [
      "Qual foi a coisa mais aleatória que já aconteceu com você?",
      "Tem algum crush secreto no momento? 👀",
      "Qual série ou filme você recomenda assistir urgente?",
      "Uma opinião impopular sua?",
      "Se pudesse viajar hoje para qualquer lugar, para onde iria?",
      "Qual fofoca ou segredo você nunca contou para ninguém?"
    ];

    // Escuta TODAS as mensagens do mural em tempo real (funciona em qualquer celular)
    const q = query(collection(db, "messages"), orderBy("createdAt", "desc"));

    onSnapshot(
      q,
      (snapshot) => {
        allMessages = [];
        snapshot.forEach((docSnap) => {
          allMessages.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderMessages();
      },
      (error) => {
        console.error(error);
        messagesList.innerHTML = `<p class="empty">⚠️ Falta configurar as chaves do Firebase no código para sincronizar entre celulares.</p>`;
      }
    );

    function renderMessages() {
      const selectedFilter = filterPerson.value;
      const filtered =
        selectedFilter === "ALL"
          ? allMessages
          : allMessages.filter((m) => m.to === selectedFilter);

      if (filtered.length === 0) {
        messagesList.innerHTML = `<p class="empty">Nenhuma pergunta por aqui ainda. Mande a primeira! 🤫</p>`;
        return;
      }

      messagesList.innerHTML = "";
      filtered.forEach((msg) => {
        const card = document.createElement("div");
        card.className = "msg-card";

        const dateStr = msg.createdAt?.toDate
          ? msg.createdAt.toDate().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })
          : "Agora mesmo";

        const targetName = msg.to || "Geral";

        card.innerHTML = `
          <div class="msg-question">
            <div class="msg-meta">
              <span>🕵️ Anônimo → <span class="tag-to">Para: ${escapeHTML(targetName)}</span></span>
              <span>${dateStr}</span>
            </div>
            <div class="msg-text">${escapeHTML(msg.text)}</div>
          </div>
          <div class="msg-answer-box">
            ${
              msg.answer
                ? `<div class="msg-meta"><span>💬 Resposta de <strong>${escapeHTML(targetName)}</strong></span></div>
                   <div class="answer-text">${escapeHTML(msg.answer)}</div>`
                : `<form class="reply-form" data-id="${msg.id}">
                     <input type="text" placeholder="Responder como ${escapeHTML(targetName)}..." required />
                     <button type="submit" class="btn-primary">Responder</button>
                   </form>`
            }
          </div>
        `;

        const replyForm = card.querySelector(".reply-form");
        if (replyForm) {
          replyForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = replyForm.querySelector("input");
            const answerText = input.value.trim();
            if (!answerText) return;

            await updateDoc(doc(db, "messages", msg.id), {
              answer: answerText
            });
          });
        }

        messagesList.appendChild(card);
      });
    }

    // Enviar pergunta anônima para o banco na nuvem
    questionForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = questionInput.value.trim();
      if (!text) return;

      sendBtn.disabled = true;
      sendBtn.textContent = "Enviando...";

      try {
        await addDoc(collection(db, "messages"), {
          to: targetSelect.value,
          text,
          answer: "",
          createdAt: serverTimestamp()
        });

        questionInput.value = "";
        charCount.textContent = "0/300";
      } catch (err) {
        alert("Erro ao enviar. Verifique se o Firebase está configurado.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Enviar anonimamente 🚀";
      }
    });

    filterPerson.addEventListener("change", renderMessages);

    questionInput.addEventListener("input", () => {
      charCount.textContent = `${questionInput.value.length}/300`;
    });

    document.getElementById("diceBtn").addEventListener("click", () => {
      const random = randomPrompts[Math.floor(Math.random() * randomPrompts.length)];
      questionInput.value = random;
      charCount.textContent = `${random.length}/300`;
    });

    document.getElementById("shareBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(window.location.href);
      alert("Link do mural copiado! Mande no grupo para todos entrarem.");
    });

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }
  </script>
</body>
</html>
