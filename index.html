<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Segredo.me — Perguntas e Respostas Anônimas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #ec4899;
      --secondary: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      max-width: 780px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      max-width: 780px;
      margin: 1.25rem auto;
      padding: 0 1rem 4rem;
    }

    /* Abas da Galera */
    .tabs-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.25rem;
      background: var(--card);
      padding: 0.65rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
    }

    .person-tab {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 0.65rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .person-tab:hover {
      border-color: var(--primary);
    }

    .person-tab.active {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.35);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .profile-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }

    .profile-info h1 {
      font-size: 1.35rem;
    }

    .profile-info p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .textarea-wrapper {
      position: relative;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 2.75rem 1rem 1rem;
      color: var(--text);
      font-size: 1rem;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    #diceBtn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.35rem 0.5rem;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
    }

    #charCount {
      font-size: 0.8rem;
      color: var(--muted);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 0.6rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-primary, .btn-send {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      padding: 0.65rem 1.2rem;
    }

    .btn-secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.95rem;
      font-size: 0.85rem;
    }

    .feed-section {
      margin-top: 2rem;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .feed-header h2 {
      font-size: 1.1rem;
    }

    .filter-tabs {
      display: flex;
      gap: 0.4rem;
    }

    .filter-tab {
      background: var(--card);
      color: var(--muted);
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      border: 1px solid var(--border);
    }

    .filter-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .msg-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.9rem;
      overflow: hidden;
    }

    .msg-question {
      background: linear-gradient(90deg, rgba(236, 72, 153, 0.15), rgba(139, 92, 246, 0.15));
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .msg-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      display: flex;
      justify-content: space-between;
    }

    .msg-text {
      font-size: 1rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .msg-answer-box {
      padding: 1rem 1.25rem;
    }

    .answer-text {
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .reply-form {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    .reply-form input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.55rem 0.75rem;
      color: var(--text);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      background: var(--card);
      border-radius: 0.9rem;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">🤫 Segredo.me</div>
    <button id="shareBtn" class="btn-secondary">🔗 Copiar link desta aba</button>
  </header>

  <main class="container">
    <!-- Abas dos Participantes -->
    <nav id="tabsNav" class="tabs-nav" aria-label="Participantes"></nav>

    <!-- Caixa de Envio Anônimo -->
    <section class="card">
      <div class="profile-header">
        <div class="profile-info">
          <div id="profileAvatar" class="avatar">🌸</div>
          <div>
            <h1 id="profileName">Isa</h1>
            <p id="profileBio">Mande uma pergunta 100% anônima para Isa!</p>
          </div>
        </div>
      </div>

      <form id="questionForm">
        <div class="textarea-wrapper">
          <textarea
            id="questionInput"
            maxlength="300"
            placeholder="Escreva sua pergunta anônima aqui... ninguém vai saber que foi você 👀"
            required
          ></textarea>
          <button type="button" id="diceBtn" title="Gerar pergunta aleatória">🎲</button>
        </div>
        <div class="form-footer">
          <span id="charCount">0/300</span>
          <button type="submit" id="sendBtn" class="btn-send">Enviar para Isa 🚀</button>
        </div>
      </form>
    </section>

    <!-- Mural de Perguntas e Respostas da Aba Selecionada -->
    <section class="feed-section">
      <div class="feed-header">
        <h2 id="feedTitle">Mural de Isa</h2>
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">Todas</button>
          <button class="filter-tab" data-filter="answered">Respondidas</button>
          <button class="filter-tab" data-filter="unanswered">Sem resposta</button>
        </div>
      </div>

      <div id="messagesList" class="messages-list">
        <p class="empty">Carregando mensagens...</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      updateDoc,
      onSnapshot,
      query,
      where,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // 🔧 COLE AQUI AS CONFIGURAÇÕES DO SEU PROJETO FIREBASE
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO_ID",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Lista fixa das abas solicitadas
    const PARTICIPANTS = [
      { id: "isa", name: "Isa", avatar: "🌸" },
      { id: "kai", name: "Kai", avatar: "⚡" },
      { id: "sara", name: "Sara", avatar: "✨" },
      { id: "jhon", name: "Jhon", avatar: "🔥" },
      { id: "bruna", name: "Bruna", avatar: "🦋" },
      { id: "efrain", name: "Efrain", avatar: "🎯" },
      { id: "rubens", name: "Rubens", avatar: "🚀" },
      { id: "jean", name: "Jean", avatar: "🎧" },
      { id: "renan", name: "Renan", avatar: "😎" }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const initialParam = (urlParams.get("u") || "isa").toLowerCase();
    let currentUser = PARTICIPANTS.some((p) => p.id === initialParam) ? initialParam : "isa";
    let currentFilter = "all";
    let unsubscribeMessages = null;

    const randomPrompts = [
      "Qual foi a coisa mais aleatória que já aconteceu com você?",
      "Tem algum crush secreto no momento? 👀",
      "Qual série ou filme você recomenda assistir urgente?",
      "Uma opinião impopular sua?",
      "Se pudesse viajar hoje para qualquer lugar, para onde iria?",
      "Qual fofoca ou segredo você nunca contou para ninguém?"
    ];

    const tabsNav = document.getElementById("tabsNav");
    const profileAvatar = document.getElementById("profileAvatar");
    const profileName = document.getElementById("profileName");
    const profileBio = document.getElementById("profileBio");
    const sendBtn = document.getElementById("sendBtn");
    const feedTitle = document.getElementById("feedTitle");
    const questionForm = document.getElementById("questionForm");
    const questionInput = document.getElementById("questionInput");
    const charCount = document.getElementById("charCount");
    const messagesList = document.getElementById("messagesList");

    function getParticipant(id) {
      return PARTICIPANTS.find((p) => p.id === id) || PARTICIPANTS[0];
    }

    function renderTabs() {
      tabsNav.innerHTML = "";
      PARTICIPANTS.forEach((person) => {
        const btn = document.createElement("button");
        btn.className = `person-tab ${person.id === currentUser ? "active" : ""}`;
        btn.innerHTML = `<span>${person.avatar}</span> <span>${person.name}</span>`;
        btn.onclick = () => selectTab(person.id);
        tabsNav.appendChild(btn);
      });

      const active = getParticipant(currentUser);
      profileAvatar.textContent = active.avatar;
      profileName.textContent = active.name;
      profileBio.textContent = `Mande uma pergunta 100% anônima para ${active.name}!`;
      sendBtn.textContent = `Enviar para ${active.name} 🚀`;
      feedTitle.textContent = `Mural de ${active.name}`;
    }

    function selectTab(userId) {
      currentUser = userId;
      const newUrl = `${window.location.pathname}?u=${currentUser}`;
      window.history.pushState({}, "", newUrl);
      renderTabs();
      listenMessages();
    }

    function listenMessages() {
      if (unsubscribeMessages) unsubscribeMessages();

      const q = query(
        collection(db, "messages"),
        where("to", "==", currentUser),
        orderBy("createdAt", "desc")
      );

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const msgs = [];
        snapshot.forEach((docSnap) => {
          msgs.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderMessages(msgs);
      });
    }

    function renderMessages(messages) {
      const active = getParticipant(currentUser);
      const filtered = messages.filter((m) => {
        if (currentFilter === "answered") return Boolean(m.answer);
        if (currentFilter === "unanswered") return !m.answer;
        return true;
      });

      if (filtered.length === 0) {
        messagesList.innerHTML = `<p class="empty">Nenhuma pergunta na aba de ${active.name} ainda. Seja o primeiro a perguntar! 🤫</p>`;
        return;
      }

      messagesList.innerHTML = "";
      filtered.forEach((msg) => {
        const card = document.createElement("div");
        card.className = "msg-card";

        const dateStr = msg.createdAt?.toDate
          ? msg.createdAt.toDate().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })
          : "Agora mesmo";

        card.innerHTML = `
          <div class="msg-question">
            <div class="msg-meta">
              <span>🕵️ Anônimo perguntou para ${active.name}</span>
              <span>${dateStr}</span>
            </div>
            <div class="msg-text">${escapeHTML(msg.text)}</div>
          </div>
          <div class="msg-answer-box">
            ${
              msg.answer
                ? `<div class="msg-meta"><span>💬 Resposta de ${active.name}</span></div>
                   <div class="answer-text">${escapeHTML(msg.answer)}</div>`
                : `<form class="reply-form" data-id="${msg.id}">
                     <input type="text" placeholder="Responder como ${active.name}..." required />
                     <button type="submit" class="btn-primary">Responder</button>
                   </form>`
            }
          </div>
        `;

        const replyForm = card.querySelector(".reply-form");
        if (replyForm) {
          replyForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = replyForm.querySelector("input");
            const answerText = input.value.trim();
            if (!answerText) return;

            await updateDoc(doc(db, "messages", msg.id), {
              answer: answerText
            });
          });
        }

        messagesList.appendChild(card);
      });
    }

    // Enviar pergunta anônima (nenhum dado do remetente é gravado)
    questionForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = questionInput.value.trim();
      if (!text) return;

      await addDoc(collection(db, "messages"), {
        to: currentUser,
        text,
        answer: "",
        createdAt: serverTimestamp()
      });

      questionInput.value = "";
      charCount.textContent = "0/300";
    });

    questionInput.addEventListener("input", () => {
      charCount.textContent = `${questionInput.value.length}/300`;
    });

    document.getElementById("diceBtn").addEventListener("click", () => {
      const random = randomPrompts[Math.floor(Math.random() * randomPrompts.length)];
      questionInput.value = random;
      charCount.textContent = `${random.length}/300`;
    });

    document.querySelectorAll(".filter-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        listenMessages();
      });
    });

    document.getElementById("shareBtn").addEventListener("click", async () => {
      const active = getParticipant(currentUser);
      const shareUrl = `${window.location.origin}${window.location.pathname}?u=${currentUser}`;
      await navigator.clipboard.writeText(shareUrl);
      alert(`Link da aba de ${active.name} copiado!\n${shareUrl}`);
    });

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    renderTabs();
    listenMessages();
  </script>
</body>
</html>
